name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: '1.24'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build cross-platform CLI
        run: |
          mkdir -p dist
          VPKG="github.com/ehsaniara/joblet-rnx/v6/pkg/version"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X ${VPKG}.Version=${VERSION} -X ${VPKG}.GitCommit=${GITHUB_SHA} -X ${VPKG}.GitTag=${VERSION} -X ${VPKG}.BuildDate=${BUILD_DATE} -X ${VPKG}.Component=rnx"

          build() { GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "dist/$3" ./cmd/rnx; }
          build linux   amd64 rnx-linux-amd64
          build linux   arm64 rnx-linux-arm64
          build darwin  amd64 rnx-darwin-amd64
          build darwin  arm64 rnx-darwin-arm64
          build windows amd64 rnx-windows-amd64.exe

          cd dist
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar -czf "rnx-${VERSION}-${p}.tar.gz" "rnx-${p}"
          done
          zip "rnx-${VERSION}-windows-amd64.zip" rnx-windows-amd64.exe
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > dist/release-notes.md << EOF
          \`rnx\` is the command-line client for [Joblet](https://github.com/ehsaniara/joblet).
          It versions independently of the Joblet server; compatibility is defined by the
          shared [joblet-proto](https://github.com/ehsaniara/joblet-proto) contract.

          | rnx  | wire contract   | works with Joblet             |
          |------|-----------------|-------------------------------|
          | v6.x | joblet-proto v2 | v5.0.2+ (any proto v2 server) |

          ## Install

          Download the binary for your platform below (static, no dependencies), or:

          **Homebrew (macOS and Linux)**
          \`\`\`bash
          brew tap ehsaniara/rnx https://github.com/ehsaniara/joblet-rnx
          brew install rnx
          \`\`\`

          **Go toolchain**
          \`\`\`bash
          go install github.com/ehsaniara/joblet-rnx/v6/cmd/rnx@${VERSION}
          \`\`\`

          First-time setup: copy a client config generated by your Joblet server.
          \`\`\`bash
          mkdir -p ~/.rnx
          scp user@joblet-server:/opt/joblet/config/rnx-config.yml ~/.rnx/
          rnx job list
          \`\`\`

          Verify downloads against \`checksums.txt\`.
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          body_path: dist/release-notes.md
          generate_release_notes: true

  # The formula pins per-release URLs and sha256 values, which only exist
  # once the release above is published - so CI regenerates it afterwards
  # and opens a PR to keep main's tap current.
  update-formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate Homebrew formula
        run: ./scripts/update-homebrew-formula.sh "${GITHUB_REF#refs/tags/}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          BRANCH="formula-${VERSION}"
          if git diff --quiet Formula/rnx.rb; then
            echo "Formula already current for ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/rnx.rb
          git commit -m "pin ${VERSION} checksums in homebrew formula"
          # Force-push: the branch is CI-owned, so a re-run may overwrite it
          git push -f origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "PR for ${BRANCH} already open"
            exit 0
          fi
          gh pr create \
            --title "pin ${VERSION} checksums in homebrew formula" \
            --body "Regenerated by the release workflow from ${VERSION} checksums.txt. Rebase-merge to update the tap." \
            --base main --head "$BRANCH"
