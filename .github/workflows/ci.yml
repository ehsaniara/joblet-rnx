name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GO_VERSION: '1.24'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      - run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - run: go tool cover -func=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build rnx
        run: |
          VPKG="github.com/ehsaniara/joblet-rnx/v6/pkg/version"
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          LDFLAGS="-s -w -X ${VPKG}.Version=${VERSION} -X ${VPKG}.GitCommit=${GITHUB_SHA} -X ${VPKG}.Component=rnx"
          ext=""; [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "$LDFLAGS" -o rnx-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/rnx
          file rnx-${{ matrix.goos }}-${{ matrix.goarch }}${ext}
